{% extends "layout.html" %}

{% block title %}User: {{ user.username }}{% endblock %}

{% block content %}
  <h2>User: {{ user.username }}</h2>

  <p>
    User has entered {{ items | count }} private events.
  </p>
  <h3>Private events:</h3>
  <ul>
    {% for item in items %}
    <li><a href="/item/{{ item.id }}">{{ item.title }}</a></li>
    {% endfor %}
  </ul>
  {% endblock %}
